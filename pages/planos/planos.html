<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../../assets/favicon.png">
    <title>Planos — Seanet</title>
    <link rel="stylesheet" href="../planos/planos.css">
    <script>
        (function() {
            try {
                if (localStorage.getItem('theme') === 'light') {
                    document.documentElement.classList.add('light-mode');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>

    <header class="site-header">
        <a class="logo" href="../../index.html" aria-label="Seanet">
            <img id="logo" src="../../assets/dark-logo.png" alt="Seanet">
        </a>
        <nav class="site-nav">
            <a href="../../index.html">Início</a>
            <a href="../documentos/documentos.html">Documentos</a>
        </nav>
    </header>

    <main class="page">

        <section class="section">
            <h2 class="section-title">Planos Residenciais</h2>

            <div class="grid">
                <article class="card">
                    <div class="card-thumb">
                        <img src="../../assets/planos/Sea One.jpg" alt="Plano Sea One">
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">Sea One</h3>
                        <span class="card-price">R$ 129,90 / mês</span>
                    </div>
                    <a class="card-btn" href="../../assets/planos/Sea One.jpg" download>
                        <span class="card-btn-icon" aria-hidden="true">↓</span>
                        <span>Baixar</span>
                    </a>
                </article>

                <article class="card">
                    <div class="card-thumb">
                        <img src="../../assets/planos/Sea Prime.jpg" alt="Plano Sea Prime">
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">Sea Prime</h3>
                        <span class="card-price">R$ 169,90 / mês</span>
                    </div>
                    <a class="card-btn" href="../../assets/planos/Sea Prime.jpg" download>
                        <span class="card-btn-icon" aria-hidden="true">↓</span>
                        <span>Baixar</span>
                    </a>
                </article>

                <article class="card">
                    <div class="card-thumb">
                        <img src="../../assets/planos/Sea Black.jpg" alt="Plano Sea Black">
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">Sea Black</h3>
                        <span class="card-price">R$ 249,90 / mês</span>
                    </div>
                    <a class="card-btn" href="../../assets/planos/Sea Black.jpg" download>
                        <span class="card-btn-icon" aria-hidden="true">↓</span>
                        <span>Baixar</span>
                    </a>
                </article>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Adicionais</h2>

            <div class="grid">
                <article class="card">
                    <div class="card-thumb">
                        <img src="../../assets/planos/roku.png" alt="Roku TV">
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">Roku TV</h3>
                        <span class="card-price">Streaming</span>
                    </div>
                    <a class="card-btn" href="../../assets/planos/roku.png" download>
                        <span class="card-btn-icon" aria-hidden="true">↓</span>
                        <span>Baixar</span>
                    </a>
                </article>
            </div>
        </section>

    </main>

</body>
</html>
